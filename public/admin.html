<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quản trị | Truyện Đêm</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/admin.css">
</head>
<body class="admin-body">
<main class="admin-wrap">
  <header class="admin-head">
    <a href="/" class="back-link">← Truyện Đêm</a>
    <h1>Quản trị</h1>
    <p class="sub">Quản lý thư viện truyện của bạn.</p>
  </header>

  <section id="auth-panel" class="admin-panel">
    <h2 id="auth-title">Đăng nhập quản trị</h2>
    <form id="login-form">
      <label>Email<input id="login-email" type="email" autocomplete="username" required></label>
      <label>Mật khẩu<input id="login-password" type="password" autocomplete="current-password" required></label>
      <button class="go" type="submit">Đăng nhập</button>
    </form>
    <details class="setup-box">
      <summary>Chưa có tài khoản quản trị? Khởi tạo lần đầu</summary>
      <p class="hint">Chỉ dùng lần đầu. Cần ADMIN_SETUP_KEY đã cấu hình trong Cloudflare Workers.</p>
      <form id="setup-form">
        <label>Khóa khởi tạo<input id="setup-key" type="password" required></label>
        <label>Tên quản trị<input id="setup-name" required maxlength="80"></label>
        <label>Email<input id="setup-email" type="email" required></label>
        <label>Mật khẩu (ít nhất 10 ký tự)<input id="setup-password" type="password" minlength="10" required></label>
        <button class="go" type="submit">Tạo tài khoản quản trị</button>
      </form>
    </details>
    <p class="message" id="auth-message" role="status"></p>
  </section>

  <section id="dashboard" hidden>
    <div class="dash-top"><div><h2>Danh sách truyện</h2><p class="hint" id="admin-welcome"></p></div><button class="outline" id="logout">Đăng xuất</button></div>
    <form id="story-form" class="admin-panel">
      <h2 id="form-title">Thêm truyện mới</h2>
      <input type="hidden" id="story-id">
      <label>Tên truyện<input id="story-title" required maxlength="180"></label>
      <label>Đường dẫn (slug)<input id="story-slug" placeholder="tu-dong-tao-neu-de-trong"></label>
      <label>Tác giả<input id="story-author" maxlength="120"></label>
      <label>Mô tả<textarea id="story-description" rows="3" maxlength="2000"></textarea></label>
      <label>Link ảnh bìa<input id="story-cover" type="url" placeholder="https://..."></label>
      <div class="form-grid">
        <label>Loại truyện<select id="story-type"><option value="text">Truyện chữ</option><option value="audio">Audio</option><option value="both">Chữ và audio</option></select></label>
        <label>Trạng thái<select id="story-status"><option value="draft">Bản nháp</option><option value="published">Xuất bản</option><option value="hidden">Ẩn</option></select></label>
      </div>
      <div class="form-actions"><button class="go" type="submit" id="save-story">Lưu truyện</button><button class="outline" type="button" id="cancel-edit" hidden>Hủy sửa</button></div>
      <p class="message" id="form-message" role="status"></p>
    </form>
    <div id="story-list" class="story-list"></div>
    <section id="chapter-panel" class="admin-panel" hidden>
      <div class="dash-top"><div><h2 id="chapter-heading">Quản lý chương</h2><p class="hint">Thêm nội dung từng chương cho truyện.</p></div><button class="outline" type="button" id="close-chapters">Đóng</button></div>
      <form id="chapter-form">
        <input type="hidden" id="chapter-id">
        <label>Tên chương<input id="chapter-title" required maxlength="180" placeholder="Ví dụ: Chương 1 – Đêm mưa"></label>
        <div class="form-grid">
          <label>Số chương<input id="chapter-number" type="number" min="1" value="1" required></label>
          <label>Trạng thái<select id="chapter-status"><option value="draft">Bản nháp</option><option value="published">Xuất bản</option><option value="hidden">Ẩn</option></select></label>
        </div>
        <label>Nội dung chương<textarea id="chapter-content" rows="8" required></textarea></label>
        <label>Link audio (nếu có)<input id="chapter-audio" type="url" placeholder="https://..."></label>
        <label>Thời lượng audio (giây)<input id="chapter-duration" type="number" min="0" value="0"></label>
        <div class="form-actions"><button class="go" type="submit" id="save-chapter">Lưu chương</button><button class="outline" type="button" id="cancel-chapter" hidden>Hủy sửa</button></div>
        <p class="message" id="chapter-message" role="status"></p>
      </form>
      <div id="chapter-list" class="story-list"></div>
    </section>
  </section>
</main>
<script src="/admin.js"></script>
</body>
</html>
